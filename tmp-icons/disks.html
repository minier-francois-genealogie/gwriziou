<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin:0; background:#fff; }
  .disk {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px; background: #000; padding: 0; line-height: 0;
  }
  .disk svg { display: block; color: #fff; }
  .xs { width:16px; height:16px; }
  .xs svg { width:10px; height:10px; }
  .sm { width:20px; height:20px; }
  .sm svg { width:12px; height:12px; }
</style>
</head>
<body>
  <div id="xs" class="disk xs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 7h-4l-1.5 2H6.5A1.5 1.5 0 0 0 5 10.5v5A1.5 1.5 0 0 0 6.5 17h11A1.5 1.5 0 0 0 19 15.5v-5A1.5 1.5 0 0 0 17.5 9H15.5L14 7z" />
      <circle cx="12" cy="13" r="2.5" />
    </svg>
  </div>
  <div id="sm" class="disk sm" style="margin-left:8px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 7h-4l-1.5 2H6.5A1.5 1.5 0 0 0 5 10.5v5A1.5 1.5 0 0 0 6.5 17h11A1.5 1.5 0 0 0 19 15.5v-5A1.5 1.5 0 0 0 17.5 9H15.5L14 7z" />
      <circle cx="12" cy="13" r="2.5" />
    </svg>
  </div>
</body>
</html>

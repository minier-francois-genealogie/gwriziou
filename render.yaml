# Blueprint Render — API (Docker) + IHM static (web/)
# https://render.com/docs/blueprint-spec
#
# New → Blueprint → connecter le repo GitHub minier-francois-genealogie/gwriziou
# Au 1er démarrage API : téléchargement GEDCOM + index actes GitHub (~20 s).
# Self-ping anti veille : automatique côté API (voir server/README.md), rien à configurer sur l'IHM.

services:
  - type: web
    name: gwriziou-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AUTO_IMPORT
        value: "true"
      - key: SQLITE_PATH
        value: /data/genealogie.sqlite
      - key: CORS_ORIGINS
        value: https://gwriziou.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Gwriziou <onboarding@resend.dev>
      - key: ACCOUNT_REQUEST_TO
        value: minier.francois.genealogie@gmail.com

  - type: web
    name: gwriziou
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gwriziou-api.onrender.com
